name: Update patches doc
permissions:
#  actions: none
#  checks: none
#  contents: write
#  deployments: none
#  issues: none
#  packages: none
   pull-requests: write
#  repository-projects: none
#  security-events: none
#  statuses: none

on:
  push:
    branches:
      - 'master'
    paths:
      - 'build/**'

  workflow_dispatch:
    inputs:
      rtag:
        description: 'uazo/Spectre Browser TAG or COMMIT'
        required: true
        default: ''

env:
  RTAG: ${{ github.event.inputs.rtag }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: "Get value from dispatch"
        run: |
          if [ -z "${RTAG}" ]; then
            echo "RTAG=$GITHUB_SHA" >> $GITHUB_ENV
            echo "RTAG=$RTAG"
          fi

      - name: Checkout 'uazo/Spectre Browser' ${{ env.BRANCH }}
        uses: actions/checkout@v2
        with:
            repository: 'uazo/Spectre Browser'
            ref: ${{ github.event.inputs.rtag }}
            path: 'Spectre Browser'
            fetch-depth: 1

      - name: Generate patches doc
        run: |
          export HOME=$GITHUB_WORKSPACE

          bash ~/Spectre Browser/tools/extract-all-patch-data.sh ~/Spectre Browser/build/patches

      - name: Check differences CHANGES=${{ env.CHANGES }}
        run: |
          export HOME=$GITHUB_WORKSPACE

          cd ~/Spectre Browser
          CHANGES=0 && git diff --quiet || CHANGES=1
          echo "CHANGES=$CHANGES" >> $GITHUB_ENV

          if [[ CHANGES -eq 1 ]]; then
              git add docs/*.md
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c #v6.1.0
        if: env.CHANGES == '1'
        with:
          token: ${{ secrets.Spectre Browser_PULLS }}
          path: Spectre Browser
          base: ${{ env.BRANCH }}
          add-paths: |
            docs/*.md
          commit-message: '[AUTO][DOC] Generate patches doc for master branch'
          title: '[AUTO][DOC] Generate patches doc for master branch'
          body: ${{ env.MESSAGE }}
          delete-branch: true
          branch-suffix: short-commit-hash
